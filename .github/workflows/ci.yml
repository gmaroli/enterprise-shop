name: CI

# Paused: Buildkite is the active CI for now, so this only runs when started by hand
# (Actions tab > CI > Run workflow). To switch it back on, restore the push and
# pull_request triggers below and add its checks to the branch protection rule.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each check is its own job so it shows up as its own line on a pull request.
# Every job starts with the same shared setup (.github/actions/setup).
jobs:
  lint-eslint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run lint --filter='!@shop/etl'

  lint-ruff:
    name: Lint (Ruff, ETL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - run: pnpm --filter @shop/etl lint

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test
