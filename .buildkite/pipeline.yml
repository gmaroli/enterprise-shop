# Three logical checks, each its own line on a pull request. Each step posts its own
# GitHub commit status through `notify`, named buildkite/<check>.
# Steps run in parallel on fresh agents, so each one runs the shared setup once.
steps:
  - label: ':mag: Code quality'
    key: code-quality
    notify:
      - github_commit_status:
          context: 'buildkite/Code quality'
    timeout_in_minutes: 15
    command: .buildkite/scripts/code-quality.sh

  - label: ':hammer: Build'
    key: build
    notify:
      - github_commit_status:
          context: 'buildkite/Build'
    timeout_in_minutes: 15
    command: |
      source .buildkite/scripts/setup.sh
      pnpm build

  - label: ':white_check_mark: Unit tests'
    key: unit-tests
    notify:
      - github_commit_status:
          context: 'buildkite/Unit tests'
    timeout_in_minutes: 15
    command: |
      source .buildkite/scripts/setup.sh
      pnpm test

  - label: ':test_tube: API tests'
    key: api-tests
    notify:
      - github_commit_status:
          context: 'buildkite/API tests'
    timeout_in_minutes: 15
    artifact_paths:
      - 'apps/e2e/playwright-report/**/*'
      - 'apps/e2e/test-results/**/*'
      - 'apps/e2e/playwright-results/*.json'
      - 'api.log'
    env:
      E2E_ADMIN_EMAIL: admin@shop.test
      E2E_CUSTOMER_EMAIL: customer@shop.test
      PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results/api.json
    command: bash .buildkite/scripts/api-tests.sh
  - label: ':performing_arts: UI tests'
    key: ui-tests
    notify:
      - github_commit_status:
          context: 'buildkite/UI tests'
    timeout_in_minutes: 20
    env:
      E2E_ADMIN_EMAIL: admin@shop.test
      E2E_CUSTOMER_EMAIL: customer@shop.test
      PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results/ui.json
    artifact_paths:
      - 'apps/e2e/playwright-report/**/*'
      - 'apps/e2e/test-results/**/*'
      - 'apps/e2e/playwright-results/*.json'
      - 'api.log'
      - 'web.log'
    command: bash .buildkite/scripts/ui-tests.sh
  - wait: ~
    continue_on_failure: true

  - label: ':slack: Test summary'
    key: test-summary
    if: build.branch == "main" || build.branch == "qa/slack-test-summary"
    timeout_in_minutes: 5
    command: |
      buildkite-agent artifact download "apps/e2e/playwright-results/*.json" .
      export SLACK_BOT_TOKEN="$(buildkite-agent secret get SLACK_BOT_TOKEN)"
      node .buildkite/scripts/slack-summary.mjs apps/e2e/playwright-results/*.json
