[project]
name = "shop-etl"
version = "0.1.0"
description = "Loads the Enterprise Shop app database into the analytics warehouse."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
